<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="340" viewBox="0 0 1000 340" fill="none" role="img" aria-label="Welcome to Emerson's GitHub">
  <style>
    .t { font-family: 'JetBrains Mono','SF Mono','Fira Code',Consolas,'Courier New',monospace; }
    .fade { animation: fade 1.2s ease-out both; }
    .blink { animation: blink 1.1s steps(1) infinite; }
    @keyframes fade { from { opacity: 0; } }
    @keyframes blink { 50% { opacity: 0; } }
  </style>
  <defs>
    <clipPath id="frame"><rect width="1000" height="340" rx="8"/></clipPath>
    <clipPath id="typing"><rect x="190" y="70" width="620" height="50">
      <animate attributeName="width" values="0;0;620" keyTimes="0;.15;1" dur="2.8s" fill="freeze"/>
    </rect></clipPath>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000"/><stop offset=".55" stop-color="#070707"/><stop offset="1" stop-color="#1d1d1d"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff" stop-opacity=".2"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="far" x1="0" y1="190" x2="0" y2="222" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2c2c2c"/><stop offset="1" stop-color="#151515"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="210" x2="0" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#151515"/><stop offset="1" stop-color="#050505"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="212" x2="0" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8a8a8a" stop-opacity=".55"/><stop offset="1" stop-color="#ededed" stop-opacity=".92"/>
    </linearGradient>
    <linearGradient id="dune" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#333"/><stop offset=".45" stop-color="#151515"/><stop offset="1" stop-color="#050505"/>
    </linearGradient>
    <linearGradient id="duneFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#262626"/><stop offset="1" stop-color="#000"/>
    </linearGradient>
    <linearGradient id="meteor" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff"/>
    </linearGradient>
    <radialGradient id="vignette" cx=".5" cy=".42" r=".78">
      <stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".75"/>
    </radialGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 .09"/></feComponentTransfer>
    </filter>
  </defs>

