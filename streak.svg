<svg xmlns="http://www.w3.org/2000/svg" width="495" height="195" viewBox="0 0 495 195" fill="none" role="img">
<style>
  text { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #f2f2f2; }
  .mono { font-family: 'JetBrains Mono', 'SF Mono', 'Fira Code', Consolas, 'Courier New', monospace; }
  .muted { fill: #8b8b8b; }
  .fade { animation: fade .7s ease-out both; }
  @keyframes fade { from { opacity: 0; } }
  .ring { animation: ring 1.4s cubic-bezier(.4,0,.2,1) .2s both; } @keyframes ring { from { stroke-dashoffset: 238.76; } }
  
</style>
<defs>
  <clipPath id="frame"><rect x=".5" y=".5" width="494" height="194" rx="6"/></clipPath>
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer><feFuncA type="table" tableValues="0 .07"/></feComponentTransfer>
  </filter>
  <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#fff" stop-opacity=".22"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
  </linearGradient>
</defs>
<g clip-path="url(#frame)">
  <rect width="495" height="195" fill="#050505"/>
  <rect width="495" height="195" filter="url(#grain)"/>
  <path d="M8,22 V8 H22 M473,8 H487 V22 M8,173 V187 H22 M473,187 H487 V173" stroke="#2e2e2e"/>
  <text x="469" y="26" text-anchor="end" class="mono muted" font-size="9.5" letter-spacing="1">// STREAK</text>
  
  <line x1="165" y1="30" x2="165" y2="165" stroke="#262626"/>
  <line x1="330" y1="30" x2="330" y2="165" stroke="#262626"/>

  <g class="fade" style="animation-delay:150ms">
    <text x="82.5" y="96" text-anchor="middle" font-size="28" font-weight="700" class="mono">200</text>
    <text x="82.5" y="128" text-anchor="middle" font-size="13">Total Contributions</text>
    <text x="82.5" y="155" text-anchor="middle" font-size="10.5" class="muted">Jun 27, 2024 – Present</text>
  </g>

  <circle cx="247.5" cy="80" r="38" stroke="#2e2e2e" stroke-width="5"/>
  <circle cx="247.5" cy="80" r="38" stroke="#f2f2f2" stroke-width="5" stroke-linecap="round"
          stroke-dasharray="238.76" stroke-dashoffset="0" transform="rotate(-90 247.5 80)" class="ring"/>
  <circle cx="247.5" cy="42" r="11" fill="#050505"/>
  <path d="M0,-9 C4,-4 6.5,0 4.5,4.5 C3,7.5 -3,7.5 -4.5,4.5 C-6.5,0 -2,-3.5 0,-9 Z" transform="translate(247.5 42)" fill="#f2f2f2" class="fade" style="animation-delay:1.2s"/>
  <g class="fade" style="animation-delay:400ms">
    <text x="247.5" y="90" text-anchor="middle" font-size="28" font-weight="700" class="mono">0</text>
    <text x="247.5" y="142" text-anchor="middle" font-size="13.5" font-weight="700">Current Streak</text>
    <text x="247.5" y="163" text-anchor="middle" font-size="10.5" class="muted">No active streak</text>
  </g>

  <g class="fade" style="animation-delay:650ms">
    <text x="412.5" y="96" text-anchor="middle" font-size="28" font-weight="700" class="mono">4</text>
    <text x="412.5" y="128" text-anchor="middle" font-size="13">Longest Streak</text>
    <text x="412.5" y="155" text-anchor="middle" font-size="10.5" class="muted">Nov 23 – Nov 26, 2025</text>
  </g>
</g>
<rect x=".5" y=".5" width="494" height="194" rx="6" stroke="#262626"/>
</svg>
